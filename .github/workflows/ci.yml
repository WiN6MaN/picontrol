name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    # ubuntu-22.04 still provides Python 3.7, the version shipped with RetroPie 4.8 (Raspberry Pi OS Buster).
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.7", "3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m pytest -q

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x install.sh uninstall.sh scripts/common.sh

  ui:
    # Browser-level smoke test of the web interface (jsdom against the real server on fake hardware).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install pytest
      - run: npm install
        working-directory: tests/ui
      - run: python -m pytest tests/test_ui_smoke.py -q
