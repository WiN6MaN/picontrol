; Pi Control configuration / Configuration de Pi Control
; Installed as /etc/picontrol/picontrol.conf. Every value below is the default: delete a line to get it back.
; Installé dans /etc/picontrol/picontrol.conf. Chaque valeur ci-dessous est la valeur par défaut.
; Restart after editing / Redémarrer après modification :  sudo reboot   (or restart the autostart session)

[pins]
; BCM GPIO numbers (not physical pin numbers). Each signal needs its own pin.
; Numéros GPIO BCM (pas les numéros de broches physiques). Une broche distincte par signal.
power = 3
reset = 23
led = 14
fan = 18
; NFC reader, bit-banged SPI / lecteur NFC, SPI logiciel
nfc_sclk = 4
nfc_miso = 17
nfc_mosi = 27
nfc_cs = 22

[power]
; Latching power switch: closed to ground = ON. / Interrupteur à verrouillage : fermé à la masse = ON.
enabled = true
; Pin level that means "switch OFF": high (open, pulled up) or low. / Niveau « interrupteur OFF ».
off_level = high
; Seconds the switch must stay OFF before shutting down (ignores glitches). / Anti-rebond avant l'arrêt.
debounce = 0.3
poll_interval = 0.05
; Seconds given to RetroArch to save and quit before the shutdown command. / Délai laissé à RetroArch pour sauvegarder.
quit_grace = 1.5
shutdown_command = sudo -n shutdown -h now

[reset]
; Short press = reset the game. Held for long_press seconds = write the running game to the next tag.
; Appui court = reset du jeu. Appui long = écrit le jeu en cours sur le prochain tag.
enabled = true
debounce = 0.05
long_press = 2.0

[fan]
; Hysteresis in degrees Celsius: ON at threshold_on, OFF at threshold_off. / Hystérésis en °C.
enabled = true
threshold_on = 60.0
threshold_off = 50.0
; Seconds between temperature readings. / Secondes entre deux mesures.
interval = 5.0
; Minimum run time once started, to avoid on/off chatter. / Durée de marche minimale.
min_run = 20.0
temp_path = /sys/class/thermal/thermal_zone0/temp

[led]
enabled = true

[nfc]
enabled = true
; Seconds between polls (idle / while a game launched by a tag is running). / Intervalle de sondage.
poll_interval = 0.5
poll_interval_game = 1.0
; The tag must be absent this long (s) to count as removed. / Absence nécessaire pour compter un retrait.
remove_delay = 2.0
min_relaunch_interval = 3.0
max_read_attempts = 3
; Launch the game of a tag already in the reader at start-up. / Lancer le jeu d'un tag déjà présent au démarrage.
launch_at_start = true
; Quit the game when its tag is removed. / Quitter le jeu quand le tag est retiré.
quit_on_remove = false
; Cut the RF field before each poll so a tag is always seen "fresh". / Coupe le champ RF avant chaque sondage.
rf_reset_each_poll = true
; Seconds to present a tag after a long reset press. / Secondes pour présenter un tag après l'appui long.
write_timeout = 15.0
lock_file = /tmp/picontrol_nfc.lock

[paths]
roms_dir = /home/pi/RetroPie/roms
runcommand = /opt/retropie/supplementary/runcommand/runcommand.sh
runcommand_info = /dev/shm/runcommand.info
retroarch_cfg = /opt/retropie/configs/all/retroarch.cfg
; Used to bring EmulationStation back after a tag-launched game. / Relance d'EmulationStation.
emulationstation_command = emulationstation --no-splash
; Extra emulator process names to stop before a launch, comma separated. / Émulateurs supplémentaires.
extra_emulators =

[retroarch]
; RetroArch network commands (network_cmd_enable = true in retroarch.cfg). / Commandes réseau de RetroArch.
host = 127.0.0.1
port = 55355

[logging]
file = /var/log/picontrol.log
; DEBUG, INFO, WARNING or ERROR / niveau de détail
level = INFO
